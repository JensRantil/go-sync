name: Go

on:
  push:
  pull_request:
    branches: [master]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go environment
      uses: actions/setup-go@v7
      with:
        go-version: 1.27

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Build
      run: go test -v -race -timeout 1m ./...
